# Fuer Coolify: „Docker Compose" als Bauart waehlen und diese Datei nutzen.
# Die echten Werte kommen aus der Coolify-Oberflaeche, NIE aus dieser Datei.
services:
  web:
    build: .
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: ${DATABASE_URL}
      ADMIN_PASSWORT: ${ADMIN_PASSWORT}
      SESSION_GEHEIMNIS: ${SESSION_GEHEIMNIS}
      # Beide leer = die Website ist oeffentlich. Beide gesetzt = Name und Passwort.
      SEITE_NAME: ${SEITE_NAME:-}
      SEITE_PASSWORT: ${SEITE_PASSWORT:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      CHAT_MODELL: ${CHAT_MODELL:-claude-sonnet-5}
    volumes:
      # Hochgeladene Bilder ueberleben so jedes Deploy.
      - ktc-daten:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 4s
      retries: 3
      start_period: 20s

volumes:
  ktc-daten:
