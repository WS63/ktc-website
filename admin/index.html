<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Cockpit · Krifteler Tennis-Club</title>
<style>
:root {
  --grund:#ffffff; --flaeche:#f5f5f5; --linie:#e0e0e0;
  --text:#1e1e18; --leise:#555555;
  --signal:#0050ff; --signal-leise:#eaf0ff;
  --handlung:#ffbe00; --warnung:#fa320a; --gut:#006e00;
  --radius:8px;
}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
  color:var(--text);background:var(--flaeche);-webkit-font-smoothing:antialiased}
h1{font-size:22px;font-weight:500;margin:0}
h2{font-size:18px;font-weight:500;margin:0 0 4px}
h3{font-size:15px;font-weight:500;margin:0}
p{margin:0}
a{color:var(--signal)}
button{font:inherit;cursor:pointer;border-radius:var(--radius);border:1px solid var(--linie);
  background:var(--grund);color:var(--text);padding:9px 16px}
button:hover{border-color:var(--signal);color:var(--signal)}
button.stark{background:var(--signal);border-color:var(--signal);color:#fff}
button.stark:hover{background:#0000c8;border-color:#0000c8;color:#fff}
button.gelb{background:var(--handlung);border-color:var(--handlung);color:var(--text)}
button.gefahr{color:var(--warnung);border-color:#f3c4bb}
button.gefahr:hover{background:var(--warnung);border-color:var(--warnung);color:#fff}
button[disabled]{opacity:.45;cursor:default}
button.klein{padding:5px 11px;font-size:14px}
input,select,textarea{font:inherit;font-size:15px;width:100%;padding:9px 12px;color:var(--text);
  border:1px solid var(--linie);border-radius:var(--radius);background:var(--grund)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--signal);
  box-shadow:0 0 0 3px var(--signal-leise)}
textarea{min-height:88px;resize:vertical;line-height:1.55}
label{display:block;font-size:13px;font-weight:500;margin-bottom:5px}
.hinweis{font-size:13px;color:var(--leise);margin-top:4px}

/* Anmeldung */
#anmeldung{min-height:100vh;display:grid;place-items:center;padding:24px}
#anmeldung form{background:var(--grund);border:1px solid var(--linie);border-radius:12px;
  padding:32px;width:100%;max-width:380px}
#anmeldung h1{margin-bottom:6px}
#anmeldung p.unter{color:var(--leise);font-size:14px;margin-bottom:22px}
.pwfeld{position:relative}
.pwfeld input[data-verdeckt="1"]{-webkit-text-security:disc;text-security:disc;
  font-family:ui-monospace,Menlo,Consolas,monospace;letter-spacing:.12em;padding-right:84px}
.pwfeld input{-webkit-text-security:none}
.pwfeld button{position:absolute;right:5px;top:50%;transform:translateY(-50%);
  border:none;background:none;color:var(--leise);font-size:13px;padding:6px 9px}
.pwfeld button:hover{color:var(--signal)}

/* Gerüst */
#cockpit{display:none;grid-template-columns:232px 1fr;min-height:100vh}
nav{background:var(--grund);border-right:1px solid var(--linie);padding:20px 14px;
  position:sticky;top:0;height:100vh;overflow:auto}
nav .marke{display:flex;align-items:center;gap:9px;padding:0 8px 18px;font-size:14px;font-weight:500}
nav .marke svg{height:26px;width:auto}
nav a{display:flex;justify-content:space-between;align-items:center;gap:8px;
  padding:9px 12px;border-radius:var(--radius);text-decoration:none;color:var(--text);font-size:15px}
nav a:hover{background:var(--flaeche)}
nav a.aktiv{background:var(--signal-leise);color:var(--signal);font-weight:500}
nav .zahl{background:var(--warnung);color:#fff;font-size:12px;padding:1px 8px;border-radius:10px}
nav .trenner{border-top:1px solid var(--linie);margin:14px 8px}
main{padding:26px 30px 90px;max-width:1080px}
.kopfzeile{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:20px}
.kopfzeile .rechts{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}

/* Bausteine */
.karte{background:var(--grund);border:1px solid var(--linie);border-radius:12px;
  padding:18px 20px;margin-bottom:12px}
.zeile{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.zeile .rechts{margin-left:auto;display:flex;gap:7px;flex-wrap:wrap}
.marker{font-size:12px;padding:2px 9px;border-radius:10px;background:var(--flaeche);color:var(--leise)}
.marker.published{background:#e5f3e5;color:var(--gut)}
.marker.draft{background:#fdf1d8;color:#8a6600}
.marker.edited{background:var(--signal-leise);color:var(--signal)}
.pfad{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;color:var(--leise)}
.gitter2{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
.feldreihe{margin-bottom:14px}
.leer{color:var(--leise);padding:30px 0;text-align:center}
.warnbox{background:#fdeeea;border-left:3px solid var(--warnung);padding:12px 16px;
  border-radius:0 var(--radius) var(--radius) 0;margin-bottom:14px;font-size:14px}
.gutbox{background:#e9f4e9;border-left:3px solid var(--gut);padding:12px 16px;
  border-radius:0 var(--radius) var(--radius) 0;margin-bottom:14px;font-size:14px}
table{width:100%;border-collapse:collapse;font-size:15px}
th,td{text-align:left;padding:9px 12px 9px 0;border-bottom:1px solid var(--linie);vertical-align:top}
th{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--leise);font-weight:500}

/* Baustein-Editor */
.block{border:1px solid var(--linie);border-radius:var(--radius);margin-bottom:12px;background:var(--grund)}
.block__kopf{display:flex;align-items:center;gap:10px;padding:11px 14px;
  border-bottom:1px solid var(--linie);background:var(--flaeche);border-radius:var(--radius) var(--radius) 0 0}
.block__kopf .name{font-weight:500;font-size:15px}
.block__kopf .typ{font-size:12px;color:var(--leise);font-family:ui-monospace,Menlo,monospace}
.block__leib{padding:16px 14px}
.block[data-zu] .block__leib{display:none}
.unterliste{border:1px dashed var(--linie);border-radius:var(--radius);padding:12px;margin-bottom:9px}

/* Medien */
.medien{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.medium{border:1px solid var(--linie);border-radius:var(--radius);overflow:hidden;background:var(--grund)}
.medium img{width:100%;height:118px;object-fit:cover;display:block;background:var(--flaeche)}
.medium .u{padding:9px}
.medium input{font-size:13px;padding:6px 8px}

/* Overlay */
#overlay{position:fixed;inset:0;background:rgba(30,30,24,.45);display:none;
  place-items:center;padding:20px;z-index:50}
#overlay.auf{display:grid}
#overlay .fenster{background:var(--grund);border-radius:12px;padding:24px;
  width:100%;max-width:620px;max-height:86vh;overflow:auto}
#meldung{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:60;
  background:var(--text);color:#fff;padding:12px 22px;border-radius:26px;font-size:15px;
  opacity:0;pointer-events:none;transition:opacity .18s}
#meldung.auf{opacity:1}
#meldung[data-art="fehler"]{background:var(--warnung)}
@media(max-width:820px){
  #cockpit{grid-template-columns:1fr}
  nav{position:static;height:auto;border-right:none;border-bottom:1px solid var(--linie)}
  nav a{display:inline-flex;margin-right:4px}
  main{padding:20px 16px 80px}
}
</style>
</head>
<body>

<div id="anmeldung">
  <form id="anmeldeform" autocomplete="off">
    <h1>Cockpit</h1>
    <p class="unter">Krifteler Tennis-Club</p>
    <label for="ktc-zugang">Passwort</label>
    <!-- type="text" mit -webkit-text-security: der Passwortmanager erkennt hier
         kein Passwortfeld und fuellt nichts hinein. Sichtbar ist es trotzdem
         verdeckt. autocomplete="off" allein reicht nicht — das ignorieren die
         meisten Manager bewusst. -->
    <div class="pwfeld">
      <input id="ktc-zugang" name="ktc-zugang" type="text" inputmode="text"
             autocomplete="off" autocorrect="off" autocapitalize="off"
             spellcheck="false" data-verdeckt="1" autofocus>
      <button type="button" id="pw-zeigen" title="Passwort anzeigen">anzeigen</button>
    </div>
    <p class="hinweis" id="anmeldefehler" style="color:var(--warnung)"></p>
    <p class="hinweis" id="anmeldetipp" hidden></p>
    <button class="stark" style="width:100%;margin-top:16px">Anmelden</button>
  </form>
</div>

<div id="cockpit">
  <nav>
    <div class="marke"><span id="marke-zeichen"></span> Cockpit</div>
    <a href="#redaktion"  data-ziel="redaktion">Redaktion</a>
    <a href="#seiten"     data-ziel="seiten">Seiten</a>
    <a href="#navigation" data-ziel="navigation">Navigation <span class="zahl" id="nav-warn" hidden></span></a>
    <a href="#termine"    data-ziel="termine">Termine</a>
    <a href="#medien"     data-ziel="medien">Medien</a>
    <a href="#anfragen"   data-ziel="anfragen">Anfragen <span class="zahl" id="anfragen-zahl" hidden></span></a>
    <a href="#umleitungen" data-ziel="umleitungen">Umleitungen</a>
    <a href="#fakten"     data-ziel="fakten">Fakten</a>
    <a href="#generator"  data-ziel="generator">Generator</a>
    <a href="#assistent"  data-ziel="assistent">Assistent</a>
    <a href="#aufrufe"    data-ziel="aufrufe">Aufrufe</a>
    <div class="trenner"></div>
    <a href="#handbuch"   data-ziel="handbuch">Handbuch</a>
    <a href="/" target="_blank">Website ansehen ↗</a>
    <a href="#" id="abmelden">Abmelden</a>
  </nav>
  <main id="buehne"></main>
</div>

<div id="overlay"><div class="fenster" id="fenster"></div></div>
<div id="meldung"></div>

<script src="/admin/handbuch.js?v=1"></script>
<script src="/admin/app.js?v=1"></script>
</body>
</html>
